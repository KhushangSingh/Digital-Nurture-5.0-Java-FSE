<h2>Enrollment Request (Template-Driven)</h2>
<div *ngIf="submitted">
  <p>Enrollment request submitted successfully!</p>
</div>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label>Name</label>
    <input type="text" name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel">
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
  </div>

  <div>
    <label>Email</label>
    <input type="email" name="studentEmail" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel">
    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
  </div>

  <div>
    <label>Course ID</label>
    <input type="text" name="courseId" [(ngModel)]="courseId" required #courseCtrl="ngModel">
    <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">Course ID is required</span>
  </div>

  <div>
    <label>Preferred Semester</label>
    <select name="preferredSemester" [(ngModel)]="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required>
      I agree to terms
    </label>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <button type="button" (click)="enrollForm.resetForm()">Reset</button>
</form>
